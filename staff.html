<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Staff · Operaciones Silversea · ILS Tours</title>
<meta name="theme-color" content="#0f2d4e">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{--ils-navy:#1c3761;--ils-slate:#8797a5;--ils-bg:#f3f7fa;--ils-mint:#bdecd0;--ils-green:#3fd87c;--ils-teal:#37cba7;--warn:#e8963c;--sc:#37cba7}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--ils-bg);color:var(--ils-navy);line-height:1.45}
.hidden{display:none!important}
/* portada */
#login{position:fixed;inset:0;background:linear-gradient(175deg,#0f2d4e 0%,#0d3d5e 50%,#0a3d4a 100%);display:flex;align-items:center;justify-content:center;overflow:hidden;z-index:10}
.waves{position:absolute;left:0;right:0;bottom:0;height:42%}.waves svg{width:100%;height:100%;display:block}
.card-in{position:relative;z-index:1;background:linear-gradient(180deg,#eaf3fa 0%,#d9e9f4 100%);border:1px solid rgba(255,255,255,.6);border-radius:20px;box-shadow:0 16px 48px rgba(0,0,0,.35);padding:30px 26px 22px;width:min(380px,92vw);text-align:center}
.card-in img{max-width:150px;display:block;margin:0 auto 8px}
.card-in h2{margin:4px 0 2px;font-size:19px}.card-in p{margin:0 0 14px;font-size:13px;color:#5b6b7a}
.card-in label{display:block;text-align:left;font-size:12px;font-weight:700;margin:10px 0 4px}
.card-in input{width:100%;padding:12px;background:#fff;border:1px solid #a9c3d8;border-radius:10px;font-size:16px;text-transform:uppercase}
.card-in input#nombre{text-transform:none}
.go{width:100%;margin-top:16px;padding:12px;border:none;border-radius:24px;background:linear-gradient(90deg,#1a7a8a,#37cba7);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.err{color:#b3261e;font-size:13px;margin-top:10px;min-height:18px}
.ver{display:inline-block;margin-top:10px;background:#d8eefa;color:#0f4c75;font-size:11px;font-weight:700;padding:2px 10px;border-radius:10px}
/* app */
.top{position:sticky;top:0;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.2)}
header{background:linear-gradient(120deg,#0f2d4e,#1a7a8a);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px}
header .t{flex:1;min-width:0}header b{font-size:16px;display:block}header span{font-size:12px;opacity:.85}
header button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:16px;padding:6px 12px;font-size:12px;cursor:pointer}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:#fff;border-bottom:1px solid #e3e8ec}
nav a{flex:0 0 auto;text-decoration:none;color:var(--ils-navy);font-size:13px;font-weight:600;padding:6px 12px;border-radius:16px;background:#eef3f7}
main{max-width:1000px;margin:0 auto;padding:14px 12px 60px}
h2{font-size:17px;margin:22px 0 10px;scroll-margin-top:150px}
.band{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 4px 14px rgba(28,55,97,.12);border-right:7px solid var(--sc);border-top-right-radius:24px;border-bottom-right-radius:24px}
.band h1{margin:0;font-size:20px}.band .sub{font-size:13px;color:#4a5568;margin-top:2px}
.opsw{display:flex;gap:6px;margin-top:10px}.opsw button{border:1px solid #cfd8e0;background:#fff;border-radius:16px;padding:5px 12px;font-weight:600;cursor:pointer;color:var(--ils-navy)}.opsw button.on{background:var(--ils-navy);color:#fff}
.warn{background:#fff4e8;border-left:5px solid var(--warn);border-radius:10px;padding:10px 12px;margin:8px 0;color:#7a4b13;font-size:14px}
.warn.urgente{background:#fdecec;border-left-color:#d4111a;color:#8a1f1f}.warn.info{background:#eef6fb;border-left-color:#2f80d1;color:#1c4f86}
.fls{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.fl{background:#fff;border-radius:14px;padding:14px;box-shadow:0 4px 14px rgba(28,55,97,.12);border-top:6px solid var(--fc,#1c3761)}
.fl .fn{display:flex;justify-content:space-between;align-items:center}.fl .fn b{font-size:22px;color:var(--fc)}
.tag{font-size:11px;font-weight:800;padding:3px 9px;border-radius:10px;background:color-mix(in srgb,var(--fc) 15%,#fff);color:var(--fc)}
.ft{font-size:16px;font-weight:700;margin:6px 0 2px}.ft s{font-weight:400;color:#9aa5ad;font-size:13px;margin-left:4px}
.small{font-size:12.5px;color:#5b6b7a}
.bus{display:flex;justify-content:space-between;align-items:center;background:#f4f7f9;border-radius:10px;padding:8px 10px;margin-top:6px;border-left:4px solid var(--fc)}
.bus b{font-size:15px}.bus .h{font-size:17px;font-weight:800}
.chg{background:#fff4e8;color:#a25b00;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:8px;margin-left:4px}
.lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.lc{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 14px rgba(28,55,97,.12);border-right:7px solid var(--sc);border-top-right-radius:22px;border-bottom-right-radius:22px}
.lh{background:linear-gradient(120deg,#1c3761,#2aa98a);color:#fff;padding:9px 14px;font-size:13px}.lh b{font-size:14px}
.lc h3{margin:10px 14px 6px;font-size:15px}
.lc table{margin:0 14px 10px;border-collapse:collapse;font-size:13.5px}.lc td{padding:4px 8px;border-bottom:1px solid #eef1f3;vertical-align:top}.lc td:first-child{font-weight:700;white-space:nowrap}
.lc .cw{margin:0 14px 10px}
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.k{background:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 2px 8px rgba(28,55,97,.1)}.k b{font-size:22px;display:block}.k span{font-size:12px;color:#5b6b7a}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.d{background:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 2px 8px rgba(28,55,97,.1);font-size:13px}.d b{font-size:15px}
.ct{background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 2px 8px rgba(28,55,97,.1);font-size:14px}.ct div{margin:4px 0}.ct a{color:var(--ils-navy);font-weight:700}
.foot{margin-top:24px;text-align:center;font-size:12px;color:#8797a5}
</style>
</head>

<script>
const firebaseConfig = {apiKey:"AIzaSyBx9TV7wd06APe98AIIYyZCjUzIAv2_wH0", authDomain:"silversea-26-27.firebaseapp.com", databaseURL:"https://silversea-26-27-default-rtdb.firebaseio.com", projectId:"silversea-26-27"};
let db = null; try{ firebase.initializeApp(firebaseConfig); db = firebase.database(); }catch(e){}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SHIPC = {"Endeavour":"#f2876b","Wind":"#2e9e48","Cloud":"#7cc4f0","Nova":"#8e44ad"};
const shipC = s => { const k = Object.keys(SHIPC).find(n => String(s||"").includes(n)); return k ? SHIPC[k] : "#37cba7"; };
const DOWS = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"], MES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const dS = iso => { if(!iso) return ""; const [y,m,d] = iso.split("-"); const dt = new Date(+y,+m-1,+d); return `${DOWS[(dt.getDay()+6)%7]} ${+d} ${MES[+m-1]}`; };
const LS = (k,v) => { try{ if(v === undefined) return localStorage.getItem(k); if(v === null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){ return null; } };
let REF = null, DATA = null, OP = null, CODE = "";
const norm = c => String(c||"").toUpperCase().replace(/[.#$\[\]\/\s]/g,"");

async function entrar(code, nombre, silent){
  CODE = norm(code); if(!CODE){ return; }
  if(!db){ $("#err").textContent = "Sin conexión. Revisa internet e intenta de nuevo."; return; }
  $("#err").textContent = "Buscando…";
  try{
    const s = await db.ref("staff_resumen/" + CODE).get();
    if(!s.exists()){ $("#err").textContent = "No encontramos esa operación. Revisa el ID (ej: EV261125006)."; if(silent) LS("stf_code", null); return; }
  }catch(e){ $("#err").textContent = "No se pudo conectar. Intenta de nuevo."; return; }
  $("#err").textContent = ""; LS("stf_code", CODE); LS("stf_nombre", nombre||"");
  if(!silent) try{ db.ref("staff_accesos").push({nombre:nombre||"", code:CODE, fecha:new Date().toLocaleString("es-CL",{timeZone:"America/Santiago"}), ts:Date.now()}); }catch(e){}
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  if(REF) REF.off(); REF = db.ref("staff_resumen/" + CODE);
  REF.on("value", s => { DATA = s.val() || {}; render(); });
}
function render(){
  const ops = Object.keys(DATA||{}); if(!ops.length){ $("#main").innerHTML = '<p>Operación sin información.</p>'; return; }
  if(!OP || !DATA[OP]) OP = ops.includes("EMBARK") ? "EMBARK" : ops[0];
  const v = DATA[OP], sc = shipC(v.ship);
  document.documentElement.style.setProperty("--sc", sc);
  $("#h-ship").textContent = `${v.ship} · ${v.code}`; $("#h-sub").textContent = `${OP === "DEBARK" ? "Desembarque" : "Embarque"} · ${v.hotel||""}`;
  const fl = (v.flights||[]).map(f => `<div class="fl" style="--fc:${esc(f.color||"#1c3761")}">
      <div class="fn"><b>${esc(f.flight)}</b><span class="tag">TAG ${esc(f.tag)}</span></div>
      <div class="ft">SCL ${esc(f.dep)}${f.dep0 && f.dep0 !== f.dep ? `<s>${esc(f.dep0)}</s><span class="chg">CAMBIÓ</span>` : ""} → ${esc(f.dest)} ${esc(f.arr)}</div>
      <div class="small">${f.plane?`Plane ${esc(f.plane)} · `:""}${f.guests?`${esc(f.guests)} guests`:""}${f.jm?` · JM ${esc(f.jm)}`:""}</div>
      ${(f.buses||[]).map(b => `<div class="bus"><b>Bus ${esc(b.bus)}</b><span class="h">${esc(b.pickup)}${b.pickup0 && b.pickup0 !== b.pickup ? `<span class="chg">antes ${esc(b.pickup0)}</span>`:""}</span><span class="small">${esc(b.pax)} pax</span></div>`).join("")}
    </div>`).join("");
  const head = `<div class="lh"><b>${esc(v.ship)} · ${esc(v.code)}</b> · ${esc(v.hotel)}</div>`;
  const cu = v.cuidado ? `<div class="warn cw">⚠️ <b>Cuidado:</b> ${esc(v.cuidado)}</div>` : "";
  const mail = x => /@/.test(x) ? `<a href="mailto:${esc(x)}">${esc(x)}</a>` : esc(x);
  $("#main").innerHTML = `
    <div class="band"><h1>${esc(v.ship)} · ${esc(v.code)}</h1><div class="sub">${esc(v.subtitle)}</div>
      ${ops.length > 1 ? `<div class="opsw">${ops.map(o => `<button data-op="${o}" class="${o===OP?"on":""}">${o === "DEBARK" ? "Desembarque" : "Embarque"}</button>`).join("")}</div>` : ""}</div>
    ${v.cuidado ? `<div class="warn">⚠️ <b>Cuidado:</b> ${esc(v.cuidado)}</div>` : ""}
    <h2 id="vuelos">✈️ Vuelos chárter y buses${v.embark_date ? ` · ${esc(dS(v.embark_date))}` : ""}</h2>
    <div class="fls">${fl || '<p class="small">Sin vuelos cargados.</p>'}</div>
    <h2 id="hotel">🏨 Hotel y logística</h2>
    <div class="lg">${(v.cards||[]).map(c => `<div class="lc">${head}<h3>${esc(c.icon)} ${esc(c.titulo)}</h3><table>${(c.filas||[]).map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</table>${cu}</div>`).join("")}</div>
    <h2 id="avisos">⚠️ Avisos</h2>
    ${(v.avisos||[]).length ? v.avisos.map(a => `<div class="warn ${esc(a.nivel)}">${esc(a.texto)}${a.ts?` <span class="small">· ${esc(a.ts)}</span>`:""}</div>`).join("") : '<p class="small">Sin avisos.</p>'}
    <div class="kp">${(v.kpis||[]).map(k => `<div class="k"><b>${esc(k.v)}</b><span>${esc(k.t)}</span></div>`).join("")}</div>
    <h2 id="dias">📅 Pax por día</h2>
    <div class="days">${(v.days||[]).map(d => `<div class="d"><b>${esc(d.label)}</b><div>${esc(d.inhouse)} in-house</div><div class="small">Check-in ${esc(d.checkin)} · traslado ${esc(d.transfer)}${d.onown!==""?` · on own ${esc(d.onown)}`:""}</div>${d.desk?`<div class="small">🛎️ Desk ${esc(d.desk)}</div>`:""}${(d.flags||[]).map(x=>`<div class="small">• ${esc(typeof x === "string" ? x : (x.t||x.text||""))}</div>`).join("")}</div>`).join("")}</div>
    <h2 id="contactos">📇 Contactos</h2>
    <div class="ct">${v.ejecutiva?`<div>👩‍💼 Ejecutiva a cargo: <b>${esc(v.ejecutiva)}</b></div>`:""}${(v.contactos||[]).map(c => `<div>${esc(c.t)}: ${mail(c.v)}</div>`).join("")}</div>
    <div class="foot">Información en vivo · actualizada ${esc(v.publicado||v.updated||"")}</div>`;
  document.querySelectorAll("[data-op]").forEach(b => b.addEventListener("click", () => { OP = b.dataset.op; render(); }));
  if(!render.done && location.hash !== "#hotel"){ render.done = true; setTimeout(() => { const el = $("#vuelos"); if(el) el.scrollIntoView(); }, 50); }
}
$("#f").addEventListener("submit", e => { e.preventDefault(); entrar($("#code").value, $("#nombre").value.trim()); });
$("#salir").addEventListener("click", () => { if(REF) REF.off(); REF = null; OP = null; render.done = false; LS("stf_code", null); $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); $("#code").value = ""; });
$("#nombre").value = LS("stf_nombre") || "";
const q = new URLSearchParams(location.search).get("op");
if(q) $("#code").value = q;
if(LS("stf_code") && !q) entrar(LS("stf_code"), LS("stf_nombre"), true);
</script>
</body>
</html>
